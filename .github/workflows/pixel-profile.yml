name: Generate Pixel Profile Card

on:
  schedule:
    - cron: "0 3 * * *"          
  workflow_dispatch:           

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Pixel Card
        uses: LuciNyan/pixel-profile/action@main
        with:
          outputs: |
            dist/github-stats.png?username=Atrasoufi&theme=pink&pixelate_avatar=true&screen_effect=true&include_all_commits=true&hide=issues

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
